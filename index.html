<style>
@property --modo{syntax:'<color>';inherits:true;initial-value:#38b6ff}
:root{
  --txt:#eaf4fd; --txt2:rgba(205,225,245,.58); --linha:rgba(255,255,255,.07);
  --accent:#38b6ff; --warn:#ffd166; --danger:#ff6b6b;
  --modo:#38b6ff;
  --ease:cubic-bezier(.22,1,.36,1);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--txt);min-height:100vh;
  background:radial-gradient(ellipse at 15% 90%,rgba(0,80,160,.38) 0%,transparent 60%),radial-gradient(ellipse at 85% 10%,rgba(0,150,180,.22) 0%,transparent 55%),#020a14;
  background-attachment:fixed;display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* topo */
.topo{width:100%;max-width:400px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.abas{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--linha);backdrop-filter:blur(10px)}
.aba{padding:7px 18px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--txt2);transition:background .35s var(--ease),color .35s}
.aba[aria-selected=true]{background:rgba(255,255,255,.12);color:var(--txt)}
.eu{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--linha);font-size:16px;color:var(--txt2)}

/* cartão */
.card{position:relative;width:100%;max-width:400px;border-radius:34px;padding:20px 20px 16px;overflow:hidden;
  background:linear-gradient(180deg,rgba(18,26,38,.86),rgba(10,16,26,.9));
  border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:0 30px 70px -20px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06);
  transition:--modo .8s var(--ease),box-shadow .8s}
.card::before{content:'';position:absolute;left:-20%;right:-20%;top:-30%;height:75%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 60%,color-mix(in srgb,var(--modo) 22%,transparent),transparent 65%);opacity:0;transition:opacity .9s var(--ease)}
.card[data-on="1"]::before{opacity:1}
.card[data-turbo="1"]::before{opacity:1;animation:pulso 1.6s ease-in-out infinite}
@keyframes pulso{50%{opacity:.55}}
.card>*{position:relative}

.cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nome{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600}
.nome svg{font-size:19px;color:var(--txt2)}
.nome small{font-weight:400;color:var(--txt2);font-size:15px}
.power{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--txt2);transition:background .5s var(--ease),color .3s,box-shadow .5s,transform .2s}
.power svg{font-size:23px;stroke-width:2.2}
.power:active{transform:scale(.92)}
.card[data-on="1"] .power{background:var(--modo);color:#04243c;box-shadow:0 0 0 6px color-mix(in srgb,var(--modo) 18%,transparent),0 8px 26px color-mix(in srgb,var(--modo) 55%,transparent)}

.cab-bt{display:flex;align-items:center;gap:10px}
.mini{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--txt2);transition:background .4s var(--ease),color .3s,transform .2s}
.mini svg{font-size:20px}
.mini:active{transform:scale(.92)}
.mini[aria-pressed=true]{background:color-mix(in srgb,var(--warn) 22%,rgba(255,255,255,.05));color:var(--warn)}
.cena{position:relative;height:236px;margin:4px -6px 0}
.cena svg.un{position:absolute;left:0;top:0;width:100%;height:auto;overflow:visible}
#fx-ar{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

.temp{display:flex;align-items:flex-start;line-height:.9;margin:0 0 16px;min-height:64px;transition:opacity .5s}
.temp .num{font-size:78px;font-weight:300;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.temp sup{font-size:22px;font-weight:400;color:var(--txt2);margin:8px 0 0 4px}
.temp.off{opacity:.3}

.ajuste{display:flex;align-items:center;gap:12px}
.bt{width:44px;height:44px;flex:none;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:20px;transition:transform .2s,background .3s}
.bt:active{transform:scale(.9);background:rgba(255,255,255,.14)}
.slider{flex:1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:56px;background:transparent;margin:0;touch-action:none;display:block}
input[type=range]::-webkit-slider-runnable-track{height:56px;border-radius:28px;background:linear-gradient(90deg,color-mix(in srgb,var(--modo) 55%,#16409a),var(--modo)) 0/var(--p,50%) 100% no-repeat,rgba(255,255,255,.07)}
input[type=range]::-moz-range-track{height:56px;border-radius:28px;background:linear-gradient(90deg,color-mix(in srgb,var(--modo) 55%,#16409a),var(--modo)) 0/var(--p,50%) 100% no-repeat,rgba(255,255,255,.07)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:42px;height:42px;margin-top:7px;border-radius:50%;background:#f4f9ff;box-shadow:0 4px 14px rgba(0,0,0,.45)}
input[type=range]::-moz-range-thumb{width:42px;height:42px;border:0;border-radius:50%;background:#f4f9ff;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.escala{display:flex;justify-content:space-between;font-size:11px;color:var(--txt2);margin:3px 60px 0}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.tile{background:rgba(255,255,255,.05);border-radius:22px;padding:14px 12px 13px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:92px;position:relative;
  transition:transform .25s var(--ease),background .35s,box-shadow .35s}
.tile:active{transform:scale(.96)}
.tile .ic{font-size:23px;color:var(--txt2);margin-bottom:6px;transition:color .4s}
.tile .lb{font-size:12px;color:var(--txt2)}
.tile .vl{font-weight:600;font-size:14.5px}
.tile[aria-pressed=true]{background:color-mix(in srgb,var(--modo) 16%,rgba(255,255,255,.04));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--modo) 45%,transparent)}
.tile[aria-pressed=true] .ic,.tile.modo .ic{color:var(--modo)}
.sw{position:absolute;right:12px;top:13px;width:42px;height:25px;border-radius:13px;background:rgba(255,255,255,.14);transition:background .35s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#f4f9ff;transition:transform .35s var(--ease)}
.tile[aria-pressed=true] .sw{background:var(--modo)}
.tile[aria-pressed=true] .sw::after{transform:translateX(17px)}

.extras{display:flex;gap:8px;margin-top:10px}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 10px;border-radius:999px;background:rgba(255,255,255,.04);font-size:13.5px;color:var(--txt2);transition:background .3s,transform .2s}
.pill:active{transform:scale(.97);background:rgba(255,255,255,.09)}
.pill b{color:var(--txt);font-weight:600}
.pill svg{font-size:16px}

.rodape{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--txt2);min-height:30px}
.rodape .st{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#1de9b6;box-shadow:0 0 8px #1de9b6}
.dot.av{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--txt);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.rodape button{width:30px;height:30px;display:grid;place-items:center;color:var(--txt2);font-size:17px}

.ultimo{width:100%;max-width:400px;margin-top:14px;text-align:center;font-size:13px;color:var(--txt2)}
.msg{width:100%;max-width:400px;text-align:center;margin-top:70px;line-height:1.55;color:var(--txt2)}
.msg h2{font:800 24px Syne,sans-serif;margin:0 0 10px;color:var(--txt)}
.btn{background:var(--accent);color:#03203a;border-radius:999px;padding:13px 24px;font-weight:600;margin:6px}
.btn.sec{background:rgba(255,255,255,.08);color:var(--txt)}

/* gaveta */
.ov{position:fixed;inset:0;background:rgba(1,8,16,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10;backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.ov.on{opacity:1;visibility:visible}
.sheet{width:100%;max-width:400px;background:rgba(14,22,34,.95);border-radius:30px 30px 0 0;padding:20px 16px max(22px,env(safe-area-inset-bottom));max-height:75vh;overflow:auto;
  transform:translateY(40px);transition:transform .45s var(--ease)}
.ov.on .sheet{transform:none}
.sheet h3{font-size:15px;font-weight:600;margin:0 0 8px 6px;color:var(--txt2)}
.op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:16px;padding:14px 12px;font-size:15.5px;transition:background .2s}
.op svg{font-size:20px;color:var(--txt2)}
.op:active,.op[aria-checked=true]{background:rgba(255,255,255,.08)}
.op[aria-checked=true]{font-weight:600}.op[aria-checked=true] svg{color:var(--accent)}
.hist{display:flex;flex-direction:column;font-size:14.5px}
.hist div{padding:11px 6px;border-bottom:1px solid var(--linha)}.hist small{color:var(--txt2);margin-left:6px}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,10px);background:rgba(14,22,34,.95);border:1px solid var(--linha);border-radius:999px;padding:11px 20px;font-size:14px;opacity:0;pointer-events:none;transition:.35s var(--ease);z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* presets */
.presets{margin-top:16px}
.pr-hd{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--txt2);margin:0 4px 8px}
.pr-hd button{font-size:12.5px;color:var(--txt2);padding:4px 8px;border-radius:999px}
.pr-hd button[aria-pressed=true]{background:rgba(255,255,255,.1);color:var(--txt)}
.pr-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -4px;padding-left:4px}
.pr-row::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:10px 15px;border-radius:999px;background:rgba(255,255,255,.06);font-size:14px;font-weight:500;white-space:nowrap;transition:background .3s,transform .2s,box-shadow .3s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--modo) 18%,rgba(255,255,255,.05));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--modo) 50%,transparent)}
.chip.novo{color:var(--txt2);background:transparent;box-shadow:inset 0 0 0 1px var(--linha)}
.chip.edit::after{content:'✎';font-size:12px;opacity:.6}
.pr-vazio{font-size:13px;color:var(--txt2);padding:6px 4px}
/* editor de preset */
.in{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--linha);border-radius:16px;padding:14px 16px;color:var(--txt);font:inherit;font-size:16px;outline:none}
.in:focus{border-color:var(--accent)}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.emojis button{width:42px;height:42px;border-radius:14px;font-size:21px;background:rgba(255,255,255,.05)}
.emojis button[aria-pressed=true]{background:rgba(56,182,255,.22);box-shadow:inset 0 0 0 1px var(--accent)}
.campo{padding:12px 4px;border-top:1px solid var(--linha)}
.campo-hd{display:flex;align-items:center;justify-content:space-between;font-size:14.5px;font-weight:500}
.tg{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.14);position:relative;transition:background .3s}
.tg::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#f4f9ff;transition:transform .3s var(--ease)}
.tg[aria-pressed=true]{background:var(--accent)}.tg[aria-pressed=true]::after{transform:translateX(18px)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.opts button{padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.06);font-size:13.5px}
.opts button[aria-pressed=true]{background:rgba(56,182,255,.22);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.step{display:flex;align-items:center;gap:14px;margin-top:10px}
.step button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.07);font-size:20px}
.step b{font-size:22px;min-width:52px;text-align:center;font-weight:500}
.ed-bt{display:flex;gap:8px;margin-top:14px}
.ed-bt .btn{flex:1;margin:0}
.ed-bt .perigo{background:rgba(255,107,107,.15);color:var(--danger)}
.ed-nota{font-size:12.5px;color:var(--txt2);margin:10px 4px 0;line-height:1.45}
.version{margin-top:26px;font-size:11px;color:var(--txt2);opacity:.5}
.upd{position:fixed;inset:0;z-index:30;background:rgba(1,8,16,.88);display:none;place-items:center;text-align:center;padding:24px}.upd.on{display:grid}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <div class="abas" id="abas" role="tablist"></div>

// ── Cena: aparelho + aleta + ar ──
// ligado/modo/dens/turbo vêm do estado; o resto é suavizado quadro a quadro (nada "pula").
const fx = { ar: [], gelo: [], ligado: false, modo: 'cool', dens: .55, turbo: false, aleta: .5, aletaAtual: .5, oscila: false, fase: 0,
  rAtual: 0, tAtual: 0, gAtual: 0, acc: 0, accG: 0 };
const COR = { cool:'205,230,255', heat:'255,188,135', dry:'195,235,247', fan_only:'238,245,252', auto:'175,247,228' };

const cena = () => `
<svg class="un" viewBox="0 0 360 120" aria-hidden="true">
  <defs>
    <linearGradient id="gu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e8f0f8"/><stop offset="1" stop-color="#bccbdb"/></linearGradient>
    <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef4fa"/><stop offset="1" stop-color="#aebdcf"/></linearGradient>
    <filter id="sb" x="-10%" y="-10%" width="120%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <g id="unit">
    <ellipse cx="180" cy="88" rx="140" ry="9" fill="#000" opacity=".35" filter="url(#sb)"/>
    <rect x="28" y="12" width="304" height="68" rx="24" fill="url(#gu)"/>
    <rect x="42" y="64" width="276" height="10" rx="5" fill="#0a1422"/>

    <circle id="led" cx="262" cy="49" r="1.6" fill="#2aa8f0"/><circle cx="84" cy="40" r="2" fill="#a5b6c9"/>
  </g>
</svg>
<canvas id="fx-ar"></canvas>`;

const tam = new WeakMap();
function ajusta(c) { const r = c.getBoundingClientRect(), k = r.width + 'x' + r.height; if (tam.get(c) !== k) { tam.set(c, k); const d = Math.min(devicePixelRatio || 1, 2); c.width = r.width * d; c.height = r.height * d; } }
const rnd = (a, b) => a + Math.random() * (b - a);
const suave = (v, alvo, dt, k) => v + (alvo - v) * Math.min(1, dt * k);

let ultimoT = 0;
function quadro(t) {
  const dt = Math.min((t - ultimoT) / 1000 || .016, .05); ultimoT = t; requestAnimationFrame(quadro);
  const cv = $('#fx-ar'); if (!cv) return;
  const lig = fx.ligado;
  fx.tAtual = suave(fx.tAtual, fx.turbo && lig ? 1 : 0, dt, 2.2);                     // 0..1: quanto o turbo "pegou"
  fx.rAtual = suave(fx.rAtual, lig ? 1 : 0, dt, 2.6);                                  // liga/desliga suave
  fx.gAtual = suave(fx.gAtual, lig ? 1 : 0, dt, 1.6);
  const T = fx.tAtual, lvl = fx.dens;

  // aleta: vai até a posição pedida com suavidade (e oscila de verdade no modo "Oscilar")
  if (fx.oscila) fx.fase += dt * (.9 + .8 * T);
  const alvoA = fx.oscila ? .1 + .9 * (.5 + .5 * Math.sin(fx.fase)) : fx.aleta;
  fx.aletaAtual = suave(fx.aletaAtual, alvoA, dt, fx.oscila ? 30 : 5);
  const a = fx.aletaAtual, al = $('#aleta');
  if (al) { const h = 2 + a * 17; al.setAttribute('d', `M44 70h272l${-4 - a * 3} ${h}H${48 + a * 3}z`); }
  const un = $('#unit'); if (un) un.setAttribute('transform', T > .02 ? `translate(${(Math.sin(t / 13) * .7 * T).toFixed(2)} ${(Math.cos(t / 9) * .5 * T).toFixed(2)})` : '');

  ajusta(cv);
  const W = cv.width, H = cv.height, g = cv.getContext('2d'), s = W / 360;
  g.clearRect(0, 0, W, H);
  const cor = COR[fx.modo] || COR.cool, oy = 76 + a * 14;

  // brilho suave embaixo do aparelho (a cor do modo)
  if (fx.gAtual > .01) {
    // só abaixo da boca do aparelho e com raio menor que a distância até as bordas do canvas — senão aparece um retângulo
    const gr = g.createRadialGradient(180 * s, oy * s, 0, 180 * s, oy * s, 118 * s);
    gr.addColorStop(0, `rgba(${cor},${(.13 + .1 * T) * fx.gAtual})`); gr.addColorStop(1, `rgba(${cor},0)`);
    g.fillStyle = gr; g.fillRect(0, oy * s, W, H - oy * s);
  }

  // ── linhas de ar: finas, longas, em cortina. Mais ventilação = mais, mais rápidas, mais compridas. Turbo = rajada. ──
  fx.acc += dt * (30 + 150 * lvl) * (1 + 1.7 * T) * fx.rAtual * (reduz ? .35 : 1);
  const meia = 112 + 30 * T;
  while (fx.acc >= 1 && fx.ar.length < 420) {
    fx.acc--;
    const x = 180 + rnd(-meia, meia), abre = (1 - a) * .9 + .22 + .35 * T;
    fx.ar.push({ x, y: oy, ph: rnd(0, 6.28), l: 0, vida: rnd(1.1, 1.9) * (1.12 - lvl * .15),
      vx: (x - 180) / 120 * abre * (30 + 36 * T) + rnd(-6, 6) * (1 + T),
      vy: (105 + 110 * lvl) * (1 + .75 * T) * rnd(.8, 1.2) * (.55 + .45 * a),
      len: (24 + 52 * lvl) * (1 + .65 * T) * rnd(.7, 1.3), w: rnd(.55, 1.15), amp: (3 + 9 * T) });
  }
  g.lineCap = 'round';
  for (let i = fx.ar.length - 1; i >= 0; i--) {
    const p = fx.ar[i]; p.l += dt;
    if (p.l > p.vida || p.y * s > H) { fx.ar.splice(i, 1); continue; }
    p.x += (p.vx + Math.sin(p.l * 4.5 + p.ph) * p.amp) * dt; p.y += p.vy * dt;
    const k = Math.sin(Math.PI * Math.min(1, p.l / p.vida)), al2 = (.28 + .3 * lvl + .22 * T) * Math.pow(k, .8);
    const m = Math.hypot(p.vx, p.vy) || 1, tx = p.x - p.vx / m * p.len, ty = p.y - p.vy / m * p.len;
    const gr = g.createLinearGradient(tx * s, ty * s, p.x * s, p.y * s);
    gr.addColorStop(0, `rgba(${cor},0)`); gr.addColorStop(1, `rgba(${cor},${al2.toFixed(3)})`);
    g.strokeStyle = gr; g.lineWidth = p.w * s * (1 + .5 * T);
    g.beginPath(); g.moveTo(tx * s, ty * s); g.lineTo(p.x * s, p.y * s); g.stroke();
  }

  // ── detalhes do modo: gelinho no frio, gotinhas no secar (aquecer não nevoa — só esquenta a cor) ──
  const frio = fx.modo === 'cool', seca = fx.modo === 'dry';
  if ((frio || seca) && !reduz) {
    fx.accG += dt * (frio ? 5 + 7 * lvl : 6) * (1 + T) * fx.rAtual;
    while (fx.accG >= 1 && fx.gelo.length < 60) { fx.accG--; fx.gelo.push({ x: 180 + rnd(-100, 100), y: oy + rnd(0, 6), l: 0, vida: rnd(2.4, 4), r: rnd(.9, 2.2), ph: rnd(0, 6.28), vy: seca ? rnd(70, 120) : rnd(26, 58), tipo: seca ? 1 : 0 }); }
  }
  for (let i = fx.gelo.length - 1; i >= 0; i--) {
    const f = fx.gelo[i]; f.l += dt;
    if (f.l > f.vida || f.y * s > H) { fx.gelo.splice(i, 1); continue; }
    f.y += f.vy * dt * (1 + .5 * T); f.x += Math.sin(f.l * 2 + f.ph) * (f.tipo ? 2 : 14) * dt;
    const al3 = .85 * Math.sin(Math.PI * Math.min(1, f.l / f.vida));
    if (f.tipo) { g.fillStyle = `rgba(170,228,245,${al3 * .8})`; g.beginPath(); g.ellipse(f.x * s, f.y * s, f.r * .7 * s, f.r * 1.5 * s, 0, 0, 6.283); g.fill(); }
    else { g.fillStyle = `rgba(240,249,255,${al3})`; g.beginPath(); g.arc(f.x * s, f.y * s, f.r * s, 0, 6.283); g.fill(); }
  }
}

}

  else if (t.dataset.inc) ed.c[t.dataset.inc].on = !ed.c[t.dataset.inc].on;
  else if (t.dataset.todos) ed.todos = !ed.todos;
  else if (t.dataset.setc) ed.c[t.dataset.setc].v = t.dataset.setc === 'temperature' ? +t.dataset.val : t.dataset.val;
  else if (t.dataset.tstep) ed.c.temperature.v = Math.max(16, Math.min(30, ed.c.temperature.v + +t.dataset.tstep));
  else if (t.dataset.ed === 'atual') { const e = estadoDe(ativo); for (const [k] of CAMPOS_ED) if (e[k] != null) ed.c[k].v = k === 'temperature' ? Math.round(+e[k]) : e[k]; }
  else if (t.dataset.ed === 'salvar') { salvaPreset(); return true; }
  else if (t.dataset.ed === 'apagar') { apagaPreset(); return true; }
  else return false;
  montaEditor(); return true;
}
function salvaPreset() {
  const nome = (ed.nome || '').trim(), patch = {};
  if (!nome) return toast('✏️ Dá um nome pro preset.');
  for (const [k] of CAMPOS_ED) if (ed.c[k].on) patch[k] = ed.c[k].v;
  if (!Object.keys(patch).length) return toast('⚠️ Ligue pelo menos um ajuste.');
  const obj = { nome, emoji: ed.emoji, patch, todos: ed.todos, por: ((usuario && (usuario.displayName || usuario.email)) || '').split(' ')[0], ts: Date.now() };
  Promise.resolve(backend.salvarPreset(ed.id, obj)).then(() => { toast('✅ Preset salvo!'); fecha(); },
    () => toast('⚠️ Não consegui salvar — as regras novas do Firebase já foram publicadas?'));
}
function apagaPreset() {
  if (!confirm(`Apagar o preset "${ed.nome}"?`)) return;
  Promise.resolve(backend.apagarPreset(ed.id)).then(() => { toast('🗑️ Preset apagado.'); fecha(); }, () => toast('⚠️ Não consegui apagar.'));
}

// ── Ações ──
let tTemp = null;
function setTemp(n) {
  n = Math.max(16, Math.min(30, n)); const id = ativo;
  otimista[id] = otimista[id] || {}; otimista[id].temperature = { v: n, ate: Date.now() + 5000 }; render();
  clearTimeout(tTemp); tTemp = setTimeout(() => { aplica(id, { temperature: n }); }, 350);     // junta cliques/arrasto num comando só
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return; const id = ativo;
  if (ed && acaoEditor(t)) return;
  if (t.dataset.preset) { if (editandoPresets) abreEditor(t.dataset.preset); else aplicaPreset(t.dataset.preset); }
  else if (t.id === 'pr-new') abreEditor(null);
  else if (t.id === 'pr-ed') { editandoPresets = !editandoPresets; render(); }
  else if (t.dataset.aba) { ativo = t.dataset.aba; render(); }
  else if (t.id === 'c-power') aplica(id, { power: estadoDe(id).power === 'on' ? 'off' : 'on' });
  else if (t.id === 'c-menos') setTemp((+estadoDe(id).temperature || 24) - 1);
  else if (t.id === 'c-mais') setTemp((+estadoDe(id).temperature || 24) + 1);
  else if (t.id === 'c-luz') aplica(id, { lights: estadoDe(id).lights === 'off' ? 'on' : 'off' });
  else if (t.id === 't-turbo') aplica(id, { turbo: estadoDe(id).turbo === 'on' ? 'off' : 'on' });
  else if (t.id === 'c-ref') { vibra(8); toast('🔄 Atualizando…'); render(); }
  else if (t.id === 't-hist') abreHist();
  else if (t.dataset.sheet) abreSheet(t.dataset.sheet);
  else if (t.id === 'bt-sair') { if (SIM) { localStorage.removeItem('gree_sim'); location.href = location.pathname; } else backend.signOut(backend.auth); }
  else if (t.id === 'bt-demo') { localStorage.setItem('gree_sim', '1'); location.reload(); }
  else if (t.id === 'bt-google') backend.signInWithPopup(backend.auth, backend.provider).catch(e => toast('❌ Login não completou: ' + (e.code || e.message)));
  else if (t.dataset.v !== undefined) { aplica(id, { [t.dataset.k]: t.dataset.v }); fecha(); }
});
document.addEventListener('input', ev => { if (ev.target.id === 'c-range') setTemp(+ev.target.value); else if (ev.target.id === 'ed-nome' && ed) ed.nome = ev.target.value; });
$('#ov').addEventListener('click', ev => { if (ev.target.id === 'ov') fecha(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') fecha(); });
function fecha() { sheetHist = null; ed = null; $('#ov').classList.remove('on'); }
function abreSheet(tipo) {
  ed = null; const e = estadoDe(ativo), cfg = {
    mode: ['Modo', 'mode', MODOS.map(x => [x[0], x[1], ico(x[0])])],
    fan: ['Ventilação', 'fanSpeed', VENTS.map(x => [x[0], x[1], ico('fan_only')])],
    swing: ['Aleta — direção do ar', 'swingVert', ALETAS.map(x => [x[0], x[1], ico('swing')])] }[tipo];
  $('#sheet').innerHTML = `<h3>${cfg[0]}</h3>` + cfg[2].map(o => `<button class="op" role="radio" aria-checked="${e[cfg[1]] === o[0]}" data-k="${cfg[1]}" data-v="${o[0]}">${o[2]}<span>${o[1]}</span></button>`).join('');
  $('#ov').classList.add('on');
}
function abreHist() { ed = null; sheetHist = []; $('#ov').classList.add('on'); montaHist(); }
const NOME_CAMPO = { power: v => v === 'on' ? 'ligou' : 'desligou', temperature: v => `pôs ${v}°`, mode: v => 'mudou pra ' + find(MODOS, v)[1], fanSpeed: v => 'ventilação ' + find(VENTS, v)[1].toLowerCase(), turbo: v => v === 'on' ? 'ligou o turbo' : 'desligou o turbo', swingVert: v => 'aleta: ' + find(ALETAS, v)[1].toLowerCase(), quiet: v => 'silencioso ' + v, lights: v => 'luz do visor ' + (v === 'on' ? 'acesa' : 'apagada') };
const quando = ts => { const m = Math.round((Date.now() - ts) / 60000); return m < 1 ? 'agora' : m < 60 ? `há ${m} min` : m < 1440 ? `há ${Math.round(m / 60)} h` : new Date(ts).toLocaleDateString('pt-BR'); };
const frase = h => `<b>${esc(h.quem || '?')}</b>${h.preset ? ' <i>(' + esc(h.preset) + ')</i>' : ''} ${(NOME_CAMPO[h.campo] || (() => 'mexeu em ' + esc(h.campo)))(h.para)}`;
function montaHist() {
  const l = histCache[ativo] || [];
  $('#sheet').innerHTML = '<h3>Quem mexeu</h3><div class="hist">' + (l.length ? l.map(h => `<div>${frase(h)}<small>${quando(h.ts)}</small></div>`).join('') : '<p style="color:var(--txt2);margin:8px 6px">Ainda sem registros por aqui.</p>') + '</div>';
}
const histCache = {}, histOuvindo = {};
function ouveHist(id) {
  if (histOuvindo[id]) return; histOuvindo[id] = 1;
  backend.historico(id, l => { histCache[id] = l; const u = $('#ultimo'), a = histCache[ativo]; if (a && a[0]) u.innerHTML = `Último ajuste: ${frase(a[0])} · ${quando(a[0].ts)}`; else u.textContent = ''; if (sheetHist) montaHist(); });
}

// ── Links diretos (pro app Atalhos / Central de Controle) ──
//   ?preset=Dormir                      aplica o preset (no aparelho aberto, ou nos dois se o preset for "nos dois")
//   ?acao=ligar|desligar|alternar       liga/desliga (+ &aparelho=quarto pra escolher; sem isso, o primeiro)
//   &temp=23                            (opcional) também ajusta a temperatura
//   ?luz=ligar|desligar|alternar        luz do visor (também combina com &aparelho=)
// Roda UMA vez depois que os aparelhos e os presets carregaram, e limpa o endereço (um recarregar não repete o comando).
const norm = x => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const LINK = (() => { const q = new URLSearchParams(location.search); const l = { preset: q.get('preset'), acao: q.get('acao'), aparelho: q.get('aparelho'), temp: q.get('temp'), luz: q.get('luz') }; return (l.preset || l.acao || l.temp || l.luz) ? l : null; })();
let linkFeito = !LINK, aparelhosOk = false, presetsOk = false;
function tentaLink() {
  if (linkFeito || !aparelhosOk || !presetsOk) return;
  linkFeito = true;
  history.replaceState(null, '', location.pathname + (SIM ? '?sim=1' : ''));
  const ids = Object.keys(aparelhos); if (!ids.length) return;
  if (LINK.aparelho) { const a = ids.find(i => norm(i) === norm(LINK.aparelho) || norm(aparelhos[i].nome) === norm(LINK.aparelho)); if (a) { ativo = a; tempMostrada = null; render(); } else return toast('⚠️ Aparelho "' + LINK.aparelho + '" não encontrado.'); }
  if (LINK.preset) {
    const pid = Object.keys(presets).find(i => norm(presets[i].nome) === norm(LINK.preset));
    if (!pid) return toast('⚠️ Preset "' + LINK.preset + '" não encontrado.');
    return aplicaPreset(pid);
  }
  const alvo = ativo || ids[0], patch = {};
  if (LINK.acao) { const lig = estadoDe(alvo).power === 'on', a = norm(LINK.acao); patch.power = a === 'ligar' ? 'on' : a === 'desligar' ? 'off' : (lig ? 'off' : 'on'); }
  if (LINK.luz) { const a = norm(LINK.luz), acesa = estadoDe(alvo).lights !== 'off'; patch.lights = a === 'ligar' || a === 'acender' ? 'on' : a === 'desligar' || a === 'apagar' ? 'off' : (acesa ? 'off' : 'on'); }
  if (LINK.temp && +LINK.temp >= 16 && +LINK.temp <= 30) patch.temperature = Math.round(+LINK.temp);
  if (Object.keys(patch).length) { aplica(alvo, patch); toast('✅ Pronto'); }
}

// ── Início ──
function inicia() {
  backend.ouvir(d => { aparelhos = d; Object.keys(d).forEach(ouveHist); aparelhosOk = true; render(); tentaLink(); },
    e => { $('#app').innerHTML = '<div class="msg"><h2>🔒 Sem acesso</h2><p>Esse e-mail ainda não foi liberado pra controlar os aparelhos.</p><button class="btn sec" id="bt-sair2">Sair</button></div>'; $('#bt-sair2').onclick = () => backend.signOut(backend.auth); });
  backend.presets(p => { presets = p || {}; presetsOk = true; render(); tentaLink(); });
  requestAnimationFrame(quadro);
  setInterval(render, 30000);            // atualiza os "há X min"
}
function telaLogin() {
  $('#topo').hidden = true;
  $('#app').innerHTML = '<div class="msg"><h2>🌬️ Ar da casa</h2><p>Entra com o Google pra controlar os aparelhos — e todo mundo vê quem mexeu por último.</p><button class="btn" id="bt-google">Entrar com Google</button><br><button class="btn sec" id="bt-demo">Ver demonstração</button></div>';
}
if (SIM) { backend = backendSim(); usuario = { displayName: 'Você', uid: 'sim' }; inicia(); }
else {
  backend = await backendFirebase();
  let rodando = false;
  backend.onAuthStateChanged(backend.auth, u => { usuario = u; if (!u) { telaLogin(); return; } if (!rodando) { rodando = true; inicia(); } });
}

// ── Auto-atualização (mesmo mecanismo das outras páginas) ──
async function confereVersao() {
  try { const j = await (await fetch('version.json', { cache: 'no-store' })).json(); if (j[VERSION_KEY] && j[VERSION_KEY] !== VERSION) $('#upd').classList.add('on'); } catch (e) {}
}
setInterval(confereVersao, 5 * 60 * 1000);
</script>
